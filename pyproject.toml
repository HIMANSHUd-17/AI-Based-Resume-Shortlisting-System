[project]
name = "ai-based-resume-shortlisting-system"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
	"flask>=3.0.0",
	"streamlit>=1.32.0",
	"spacy>=3.7.0",
	"scikit-learn>=1.4.0",
	"pdfplumber>=0.10.0",
	"python-docx>=1.1.0",
	"pandas>=2.0.0",
	"numpy>=1.26.0",
	"plotly>=5.18.0",
	"nltk>=3.8.0",
]

[tool.vercel]
entrypoint = "webapp:app"